<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3e5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5ba3f5;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#2d5a8c;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric shapes for visual interest -->
  <circle cx="150" cy="100" r="120" fill="url(#accentGradient1)" />
  <circle cx="1100" cy="600" r="140" fill="url(#accentGradient2)" />
  
  <!-- Soft organic shapes -->
  <path d="M 900 50 Q 950 80 920 150 Q 880 120 900 50" fill="url(#accentGradient1)" opacity="0.4"/>
  <path d="M 100 550 Q 80 600 150 620 Q 160 570 100 550" fill="url(#accentGradient2)" opacity="0.35"/>
  
  <!-- Minimal accent lines for structure -->
  <line x1="0" y1="580" x2="250" y2="580" stroke="#4a90e2" stroke-width="2" opacity="0.2"/>
  <line x1="1000" y1="80" x2="1200" y2="80" stroke="#5ba3f5" stroke-width="2" opacity="0.2"/>
  
  <!-- Central subtle gradient overlay for depth -->
  <rect x="200" y="150" width="800" height="400" fill="url(#accentGradient1)" opacity="0.15" rx="20"/>
  
  <!-- Soft corner accent -->
  <circle cx="50" cy="650" r="80" fill="#357abd" opacity="0.1"/>
  <circle cx="1150" cy="80" r="100" fill="#4a90e2" opacity="0.08"/>
</svg>
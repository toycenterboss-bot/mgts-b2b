<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <radialGradient id="grad1" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <radialGradient id="grad2" cx="0.3" cy="0.8" r="0.6">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="70%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </radialGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- Main background gradient -->
  <rect width="1200" height="700" fill="#ecf0f1"/>
  
  <!-- Subtle primary gradient overlay -->
  <ellipse cx="200" cy="150" rx="400" ry="250" fill="url(#grad1)" opacity="0.4"/>
  
  <!-- Secondary soft shapes -->
  <ellipse cx="900" cy="450" rx="350" ry="200" fill="url(#grad2)" opacity="0.3"/>
  <ellipse cx="600" cy="300" rx="250" ry="180" fill="url(#grad3)" opacity="0.25"/>
  
  <!-- Soft organic shapes -->
  <path d="M100 400 Q 300 200 500 450 Q 650 350 850 520 Q 1000 450 1100 600" 
        fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" 
        opacity="0.2" filter="url(#blur)"/>
  
  <path d="M50 500 Q 250 350 450 550 Q 550 480 750 580 L 900 520 Q 1050 600 1150 450" 
        fill="none" stroke="url(#grad3)" stroke-width="12" stroke-linecap="round" 
        opacity="0.15" filter="url(#blur)"/>
  
  <!-- Minimal geometric accents -->
  <circle cx="150" cy="100" r="80" fill="url(#grad3)" opacity="0.2"/>
  <circle cx="1050" cy="550" r="60" fill="url(#grad2)" opacity="0.18"/>
  
  <!-- Subtle wave pattern -->
  <path d="M0 620 Q150 580 300 630 Q450 590 600 640 Q750 600 900 650 Q1050 610 1200 660 L1200 700 L0 700 Z" 
        fill="url(#grad1)" opacity="0.15"/>
  
  <!-- Final soft overlay for depth -->
  <rect width="1200" height="700" fill="#ffffff" opacity="0.08"/>
</svg>
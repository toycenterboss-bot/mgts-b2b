<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- Main cinematic gradient background: deep navy to soft midnight blue, suitable for white text overlay -->
  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.6" r="0.8">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="40%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#2d4a6f"/>
      <stop offset="100%" stop-color="#1a2639"/>
    </radialGradient>
    <linearGradient id="lightGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Subtle paper-like texture pattern -->
    <pattern id="texture" patternUnits="userSpaceOnUse" width="60" height="60" x="0" y="0">
      <rect width="60" height="60" fill="#f8fafc" opacity="0.03"/>
      <circle cx="10" cy="10" r="1" fill="#e2e8f0" opacity="0.5"/>
      <circle cx="50" cy="20" r="0.8" fill="#cbd5e1" opacity="0.4"/>
      <circle cx="30" cy="50" r="1.2" fill="#94a3b8" opacity="0.3"/>
      <path d="M5 45 Q 25 35 55 55" stroke="#f1f5f9" stroke-width="0.3" opacity="0.2" fill="none"/>
    </pattern>
    <!-- Soft vignette mask for cinematic depth -->
    <radialGradient id="vignette" cx="0.5" cy="0.5">
      <stop offset="0%" stop-opacity="0"/>
      <stop offset="70%" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Subtle glow for cinematic lighting -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base gradient layer -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Overlay cinematic light gradient for depth -->
  <rect width="1200" height="700" fill="url(#lightGrad)"/>
  
  <!-- Subtle texture overlay -->
  <rect width="1200" height="700" fill="url(#texture)" opacity="0.1"/>
  
  <!-- Cinematic light rays / god rays effect -->
  <g filter="url(#glow)" opacity="0.3">
    <path d="M200 100 Q 600 50 900 120 Q 1100 200 1150 350 L1200 700 L0 700 Z" fill="#60a5fa" opacity="0.4"/>
    <path d="M100 150 Q 400 80 700 160 Q 950 250 1050 400 L1100 700 L0 700 Z" fill="#a78bfa" opacity="0.3"/>
  </g>
  
  <!-- Vignette for professional cinematic framing -->
  <rect width="1200" height="700" fill="url(#vignette)"/>
  
  <!-- Subtle horizon line with soft gradient for depth -->
  <rect y="550" width="1200" height="150" fill="#111827" opacity="0.4"/>
  <rect y="500" width="1200" height="50" fill="url(#lightGrad)" opacity="0.2"/>
  
  <!-- Fine noise grain for photorealistic texture -->
  <rect width="1200" height="700" fill="#000" opacity="0.02" filter="url(#glow)"/>
</svg>